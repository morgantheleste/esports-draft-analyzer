<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Draft Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Draft Analyzer</h1>
            <p>Propulsé par Scikit-learn, XGBoost & FastAPI</p>
        </header>

        <div class="controls-card">
            <!-- 1. Ton Champion -->
            <div class="input-group">
                <label for="champion">Ton Champion</label>
                <input list="champ-list" id="champion" placeholder="Chercher un champion..." autocomplete="off" style="padding: 12px; background-color: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; font-size: 1rem; width: 100%;">
            </div>

            <!-- 2. Champion Adverse -->
            <div class="input-group">
                <label for="enemy_champion">Champion Adverse</label>
                <input list="champ-list" id="enemy_champion" placeholder="Chercher un champion..." autocomplete="off" style="padding: 12px; background-color: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; font-size: 1rem; width: 100%;">
            </div>

            <!-- Base de données pour la barre de recherche -->
            <datalist id="champ-list"></datalist>

            <!-- 3. Rôle (C'EST CE QUI MANQUAIT !) -->
            <div class="input-group">
                <label for="position">Rôle</label>
                <select id="position" style="padding: 12px; background-color: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; font-size: 1rem; width: 100%;">
                    <option value="TOP">Toplane</option>
                    <option value="JUNGLE">Jungle</option>
                    <option value="MIDDLE">Midlane</option>
                    <option value="BOTTOM">ADC</option>
                    <option value="UTILITY">Support</option>
                </select>
            </div>

            <!-- 4. Composition globale -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <div class="input-group" style="flex: 1; margin-bottom: 0;">
                    <label>Tanks Alliés</label>
                    <input type="number" id="ally_tanks" min="0" max="4" value="1" style="padding: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155;">
                </div>
                <div class="input-group" style="flex: 1; margin-bottom: 0;">
                    <label>Tanks Ennemis</label>
                    <input type="number" id="enemy_tanks" min="0" max="4" value="1" style="padding: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155;">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <div class="input-group" style="flex: 1; margin-bottom: 0;">
                    <label>Mages Alliés</label>
                    <input type="number" id="ally_mages" min="0" max="4" value="1" style="padding: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155;">
                </div>
                <div class="input-group" style="flex: 1; margin-bottom: 0;">
                    <label>Mages Ennemis</label>
                    <input type="number" id="enemy_mages" min="0" max="4" value="1" style="padding: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155;">
                </div>
            </div>

            <!-- 5. Bouton -->
            <button id="predict-btn">Analyser le Duel</button>
        </div>

        <div id="result-container" class="hidden">
            <h2 id="result-text">--%</h2>
            <p id="result-message">En attente de l'IA...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
